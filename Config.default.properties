#PANEL WEB (http://ip-may-chu:panel.port/) - dat mat khau truoc khi mo cong ra ngoai
panel.enable=true
panel.host=0.0.0.0
panel.port=8088
panel.user=admin
panel.pass=

#WEB NGUOI CHOI (http://ip-may-chu:web.port/): trang chu, gioi thieu, dien dan, to cao, bao loi, gop y, nap ngoc
web.enable=true
web.port=8080
#Dung Cloudflare Tunnel thi dat web.host=127.0.0.1 (khong mo cong 8080 ra ngoai). web.cloudflare=true: lay IP that tu header CF-Connecting-IP
web.host=0.0.0.0
web.cloudflare=false
#Trang chu rieng tren Cloudflare Pages (thu muc cloudflare/): khoa bi mat trung bien PROXY_KEY cua Pages, de server tin IP nguoi choi do Pages gui kem
web.proxy.key=
#Link tai game hien o trang chu (de trong = an nut)
web.download.apk=
web.download.pc=
web.download.ios=
#Nap chuyen khoan QR (ma ngan hang theo VietQR: MB, VCB, ACB, TCB, BIDV, VPB...). De trong = tat. Admin duyet tren panel > Web nguoi choi
web.bank.code=
web.bank.account=
web.bank.owner=
#SePay tu dong duyet chuyen khoan: webhook https://ten-mien/callback/sepay, chung thuc API Key (dan cung key vao day). Xem docs/HUONG_DAN_WEB_CLOUDFLARE_SEPAY.md
web.sepay.apikey=
#Nap the cao qua cong gach the giao thuc chargingws/v2 (thesieure, cardvip, doithe1s...). De trong partner = admin tu kiem tra the
#Dat link callback o cong the: http://ip-may-chu:web.port/callback/card ; web.card.rate = % menh gia duoc cong
web.card.url=https://thesieure.com/chargingws/v2
web.card.partner_id=
web.card.partner_key=
web.card.rate=100

#SU KIEN (giong source V10): de trong = chay theo lich, moi luc chi 1 su kien
