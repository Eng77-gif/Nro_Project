<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngọc Rồng Online</title>
<meta name="description" content="Trang chủ máy chủ Ngọc Rồng Online: tải game, sự kiện, diễn đàn, hỗ trợ và nạp ngọc.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ee;--bg2:#f3ebdc;--card:#fffdf8;--card2:#f6eddf;--line:#ebddcb;--text:#38291f;--mute:#88715e;
  --orange:#ed8a27;--orange2:#bf5c0e;--gold:#b5720c;--blue:#2f7fc4;--green:#2e9b5c;--red:#c8423f;--violet:#7a5cc8;
  --brown:#54301c;--r:14px;--shadow:0 6px 18px rgba(84,48,28,.08);
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Be Vietnam Pro",Arial,Helvetica,sans-serif;min-height:100vh}
a{color:var(--orange2);text-decoration:none}a:hover{color:#bf5c0e}a:hover{text-decoration:underline}
h1,h2,h3{font-family:"Be Vietnam Pro",Arial,sans-serif;font-weight:800;line-height:1.2;margin:0 0 .4em;color:var(--text)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.mute{color:var(--mute)}
.pix{image-rendering:pixelated}

/* ---------- đầu trang (theo bản thiết kế cộng đồng) ---------- */
.health{background:#352217;color:#d4bd9d;font-size:11px;letter-spacing:1px}
.health .wrap{display:flex;justify-content:space-between;gap:10px;padding-top:6px;padding-bottom:6px}
header{position:sticky;top:0;z-index:20;background:var(--brown);box-shadow:0 2px 10px rgba(53,34,23,.25)}
.bar{display:flex;align-items:center;gap:14px;height:76px}
.logo{display:flex;align-items:center;gap:10px;color:#f8e5cb;font-weight:800;white-space:nowrap}
.logo:hover{text-decoration:none;color:#fff}
.logo img{width:156px;height:50px;object-fit:contain}
.logo span{position:absolute;left:-9999px}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{color:#f8e5cb;padding:9px 13px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
nav.main a:hover{background:#68432c;color:#fff;text-decoration:none}
nav.main a.on{background:#f6a039;color:#412713}
nav.main a.nap{border:1px solid #bd8550;color:#ffe0ab}
nav.main a.nap.on{background:#f6a039;color:#412713;border-color:#f6a039}
.acc .name{color:#f8e5cb!important}.acc .name b{color:#ffc574!important}
.acc{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;
  background:var(--card2);color:var(--text);border:1px solid var(--line);transition:transform .12s,filter .12s;text-decoration:none!important}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.p{background:#f6a039;color:#412713;border:0;box-shadow:0 6px 16px rgba(237,138,39,.3)}
.btn.b{background:var(--brown);color:#ffe0ab;border:0}
.btn.s{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid #bd8550;color:#f8e5cb;border-radius:10px;padding:7px 10px;cursor:pointer}

/* ---------- khung chung ---------- */
main{padding:28px 16px 60px;min-height:calc(100vh - 140px)}
main.wrap{padding-top:28px;padding-bottom:60px}
.grid>*,.news-grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.sec-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:34px 0 14px}
.sec-title h2{font-size:28px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a0663a;font-weight:700}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--bg2);white-space:nowrap}
.tag.s0{color:var(--gold);border-color:#e7c98f}.tag.s1{color:var(--blue);border-color:#a9cbea}
.tag.s2{color:var(--green);border-color:#9fd3b4}.tag.s3{color:var(--red);border-color:#e6a9a7}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}

/* ---------- trang chủ ---------- */
.game-hero{min-height:365px;position:relative;border-radius:15px;overflow:hidden;background:#312936;display:flex;align-items:center}
.game-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.game-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#221c24ed 0%,#29212cac 38%,#29212c05 75%),linear-gradient(0deg,#18191b55,transparent 40%)}
.hero-content{position:relative;z-index:1;padding:42px;max-width:620px;color:#fff}
.hero-kicker{font-size:11px;letter-spacing:2px;color:#ffc574;font-weight:700;text-transform:uppercase}
.game-hero h1{font-size:clamp(30px,5vw,46px);color:#fff;margin:10px 0 12px;line-height:1.15}
.game-hero h1 em{font-style:normal;color:#ffb44f}
.game-hero p{color:#efe3d4;font-size:15px;margin:0 0 22px}
.game-hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.game-hero .btn{border-radius:8px}
.game-hero .btn.ghost{background:transparent;color:#fff;border:1px solid #ffffff66}
.hero-caption{position:absolute;right:26px;bottom:18px;z-index:1;font-size:10px;letter-spacing:3px;color:#ffffffaa}
.online-dot{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:#ffffff1f;color:#c9f5d6;font-weight:700;font-size:13px;margin-bottom:6px}
.online-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.25)}
.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.quick-links a{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text)}
.quick-links a:hover{border-color:var(--orange);text-decoration:none;transform:translateY(-2px)}
.quick-links .qi{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:#f6e6cf;font-size:20px;flex:none}
.quick-links b{display:block;font-size:14px}.quick-links small{color:var(--mute);font-size:12px}
.quick-links i{margin-left:auto;font-style:normal;color:#b49a82}
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.news{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.news-art{aspect-ratio:2/1;background:#2b2230;overflow:hidden}
.news-art img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.news-content{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.news-content .tag{align-self:flex-start;font-size:10px;letter-spacing:1px;color:#a0663a;border-color:#ecd2b3;background:#fbf0e1}
.news-content h3{font-size:17px;margin:0}
.news-content p{margin:0;color:var(--mute);font-size:13px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.welcome{background:#f4e6d0;border:1px solid #e6cfaf;border-radius:14px;padding:22px}
.welcome h2{font-size:26px}
.event{display:flex;flex-direction:column;gap:6px}
.event h3{font-size:20px;color:var(--orange2);margin:0}
.event p{margin:0;color:var(--mute);white-space:pre-line;font-size:14px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line)}
.rank li:last-child{border:0}
.rank .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg2);font-size:13px;flex:none}
.rank li:nth-child(1) .no{background:linear-gradient(135deg,#fff3b0,#ffc83d);color:#3a2700}
.rank li:nth-child(2) .no{background:linear-gradient(135deg,#f1f5ff,#b8c4dd);color:#1b2335}
.rank li:nth-child(3) .no{background:linear-gradient(135deg,#ffd2a8,#d9864a);color:#2e1500}
.rank .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .pw{font-weight:800;color:var(--orange2);font-size:15px}
.planet{font-size:12px;color:var(--mute)}
.quick a{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text)}
.quick a:hover{border-color:var(--orange);text-decoration:none;transform:translateY(-2px)}
.quick .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.quick b{display:block;font-size:16px}.quick span{color:var(--mute);font-size:13px}

/* ---------- giới thiệu ---------- */
.nap-tb{width:100%;border-collapse:separate;border-spacing:0 6px;font-weight:700}
.nap-tb th{background:var(--brown);color:#ffe0ab;padding:8px;font-size:13px;text-align:center}.nap-tb th:first-child{border-radius:8px 0 0 8px}.nap-tb th:last-child{border-radius:0 8px 8px 0}
.nap-tb td{background:#f8ead3;padding:7px 10px;text-align:center}.nap-tb td:first-child{border-radius:8px 0 0 8px}.nap-tb td:last-child{border-radius:0 8px 8px 0}
.nap-tb img{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.feature{display:flex;gap:14px}
.feature .ico{width:52px;height:52px;flex:none;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:26px;border:1px solid var(--line)}
.feature h3{font-size:20px;margin:0 0 4px}
.feature p{margin:0;color:var(--mute);font-size:14px}
.planets .card{text-align:center}
.planets .card h3{font-size:24px}
.planets .em{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 8px}
.rules li{margin:6px 0}

/* ---------- diễn đàn, phiếu ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line);color:var(--text)}
.item:hover{background:#fbf3e6;text-decoration:none}
.item:last-child{border:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:13px;color:var(--mute)}
.item .n{text-align:center;min-width:60px;font-size:13px;color:var(--mute)}
.item .n b{display:block;font-size:18px;color:var(--text)}
.pin{color:var(--gold);font-size:12px;font-weight:700;margin-right:6px}
.pager{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.post-body{white-space:pre-wrap;word-break:break-word;font-size:15px;color:var(--text)}
.reply{padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin-top:12px}
.reply.admin{border-color:#e9b27a;background:#fdf0de}
.reply .who{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reply .who .mute{font-weight:400;font-size:12px}
form .f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
form label,.f>span{font-weight:600;font-size:14px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none}
.hint{font-size:12px;color:var(--mute)}
.page-head{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.page-head .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;flex:none}
.page-head h1{font-size:36px;margin:0}
.page-head p{margin:2px 0 0;color:var(--mute)}

/* ---------- nạp ---------- */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.tabs button.on{background:#f6a039;color:#412713;border-color:transparent}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.amounts button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-weight:700}
.amounts button.on{border-color:var(--orange);background:#fdebd2;color:var(--orange2)}
.qr{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.qr img{width:240px;border-radius:14px;background:#fff;padding:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:700;word-break:break-all}
.copy{margin-left:6px;font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.balance{display:flex;gap:16px;align-items:center;padding:16px;border-radius:14px;background:#f8ead3;border:1px solid #e9cda4}
.balance img{width:44px;height:44px}
.balance .big{font-weight:800;font-size:26px;color:var(--orange2);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tw{overflow-x:auto}

/* ---------- hộp thoại, thông báo ---------- */
.modal{position:fixed;inset:0;background:rgba(53,34,23,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:100%;max-width:420px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:12px 20px;border-radius:12px;background:var(--card2);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--red);color:var(--red)}
footer{background:#352217;padding:26px 0;color:#d4bd9d;font-size:13px;margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:980px){
  .g2,.g3{grid-template-columns:1fr}.g4,.stats{grid-template-columns:repeat(2,1fr)}
  nav.main{display:none;position:absolute;top:76px;left:0;right:0;flex-direction:column;background:var(--brown);padding:10px 16px}
  .quick-links,.news-grid{grid-template-columns:1fr 1fr}
  nav.main.open{display:flex}
  .menu-btn{display:block}
  .acc{margin-left:0}
}
@media (max-width:600px){
  .hero-content{padding:28px 20px}.hero-caption{display:none}.g4,.stats{grid-template-columns:1fr 1fr}
  .quick-links,.news-grid{grid-template-columns:1fr}.health .wrap span+span{display:none}.logo img{width:120px}
  .qr{grid-template-columns:1fr}.qr img{width:100%;max-width:280px}
  .amounts{grid-template-columns:repeat(2,1fr)}
  .item .n{display:none}
  .acc .name{display:none}
}
</style>
</head>
<body>
<a href="#main" class="mute" style="position:absolute;left:-999px">Bỏ qua tới nội dung</a>
<div class="health"><div class="wrap"><span>CỘNG ĐỒNG NGỌC RỒNG ONLINE</span><span>Chơi vui · Kết nối · Cùng trưởng thành</span></div></div>
<header>
  <div class="wrap bar">
    <a class="logo" href="#/"><img src="/assets/logo.png" alt="Chú Bé Rồng Online" width="156" height="50"><span id="sv-name">Ngọc Rồng</span></a>
    <button class="menu-btn" aria-label="Mở menu" onclick="document.querySelector('nav.main').classList.toggle('open')">☰</button>
    <nav class="main" aria-label="Điều hướng chính">
      <a href="#/" data-r="">Trang chủ</a>
      <a href="#/gioi-thieu" data-r="gioi-thieu">Giới thiệu</a>
      <a href="#/dien-dan" data-r="dien-dan">Diễn đàn</a>
      <a href="#/to-cao" data-r="to-cao">Tố cáo</a>
      <a href="#/bao-loi" data-r="bao-loi">Báo lỗi</a>
      <a href="#/gop-y" data-r="gop-y">Góp ý</a>
      <a href="#/nap" data-r="nap" class="nap">Nạp ngọc</a>
    </nav>
    <div class="acc" id="acc"></div>
  </div>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer><div class="wrap"><span>© <span id="ft-name">Ngọc Rồng</span> · Máy chủ Ngọc Rồng Online</span><span>Chơi game có trách nhiệm · Không mua bán tài khoản ngoài</span></div></footer>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('vi-VN');
const power=n=>{n=Number(n||0);return n>=1e9?(n/1e9).toFixed(n>=1e11?0:1).replace('.',',')+' tỷ':n>=1e6?(n/1e6).toFixed(0)+' tr':money(n)};
const PLANET=['Trái Đất','Namek','Xayda'];
const KIND={forum:['Diễn đàn','💬','#3fa9ff'],report:['Tố cáo','🚨','#ff5d6c'],bug:['Báo lỗi','🐞','#ffb347'],idea:['Góp ý','💡','#3ddc84']};
const STATUS=['Mới gửi','Đang xử lý','Đã xử lý','Từ chối'];
const TOP_STATUS=['Đang chờ','Thành công','Thất bại'];
let token=localStorage.getItem('nro_token')||'',me=null,info=null;

async function api(path,body){
  const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Token':token},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({error:'Lỗi kết nối'}));
  if(r.status===401&&token){token='';localStorage.removeItem('nro_token');me=null;drawAcc()}
  if(!r.ok)throw new Error(d.error||'Có lỗi xảy ra');
  return d}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3200)}
async function act(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,1)}}

/* ---------- tài khoản ---------- */
function drawAcc(){
  $('#acc').innerHTML=me?`<span class="name mute" style="font-size:13px">${esc(me.username)} · <b style="color:var(--gold)">${money(me.vnd)}đ</b></span><button class="btn s" onclick="logout()">Thoát</button>`
    :`<button class="btn s p" onclick="loginBox()">Đăng nhập</button>`}
async function loadMe(){if(!token){me=null;drawAcc();return}try{me=await api('me')}catch(e){me=null}drawAcc()}
function loginBox(after){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<form class="card" aria-labelledby="lg-t"><h2 id="lg-t" style="font-size:28px">Đăng nhập</h2><p class="mute" style="margin-top:0">Dùng tài khoản và mật khẩu chơi game.</p>
    <div class="f"><label for="lu">Tài khoản</label><input id="lu" autocomplete="username" maxlength="20" required></div>
    <div class="f"><label for="lp">Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" maxlength="100" required></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn" id="lc">Huỷ</button><button class="btn p">Đăng nhập</button></div></form>`;
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector('#lc').onclick=()=>m.remove();
  m.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await act(()=>api('login',{user:$('#lu').value,pass:$('#lp').value}));
    if(r){token=r.token;localStorage.setItem('nro_token',token);m.remove();await loadMe();toast('Xin chào '+me.username);(after||route)()}};
  document.body.append(m);$('#lu').focus()}
async function logout(){await api('logout',{}).catch(()=>{});token='';localStorage.removeItem('nro_token');me=null;drawAcc();route()}
function needLogin(what){return `<div class="card empty"><p style="font-size:40px;margin:0">🔐</p><h3>Đăng nhập để ${esc(what)}</h3><p>Dùng tài khoản chơi game của bạn.</p><button class="btn p" onclick="loginBox()">Đăng nhập</button></div>`}

/* ---------- định tuyến ---------- */
const ROUTES={'':home,'gioi-thieu':about,'dien-dan':()=>board('forum'),'to-cao':()=>board('report'),'bao-loi':()=>board('bug'),'gop-y':()=>board('idea'),'nap':topup,'bai':postPage};
async function route(){
  const parts=location.hash.replace(/^#\/?/,'').split('/'),key=parts[0]||'';
  document.querySelectorAll('nav.main a').forEach(a=>a.classList.toggle('on',a.dataset.r===key||(key==='bai'&&a.dataset.r==='dien-dan')));
  $('nav.main').classList.remove('open');
  const fn=ROUTES[key]||home;$('#main').innerHTML='<div class="empty">Đang tải…</div>';
  try{await fn(parts[1])}catch(e){$('#main').innerHTML=`<div class="card empty"><h3>Không tải được trang</h3><p>${esc(e.message)}</p></div>`}
  window.scrollTo(0,0)}

const BOARD={forum:{route:'dien-dan',title:'Diễn đàn',desc:'Trao đổi kinh nghiệm, tìm đồng đội, khoe đồ cùng cộng đồng.',btn:'Đăng bài',list:'Bài viết'},

function postRow(p){
  const k=p.kind||'forum';
  return `<a class="item" href="#/bai/${Number(p.id)}"><span class="ico" aria-hidden="true" style="font-size:22px">${KIND[k]?.[1]||'💬'}</span>
    <div class="t"><b>${p.pinned?'<span class="pin">📌 GHIM</span>':''}${esc(p.title)}</b><span>${esc(p.author)}${p.target?' · tố cáo <b style="color:var(--red)">'+esc(p.target)+'</b>':''} · ${esc(p.updated_at||p.created_at)}</span></div>
    ${p.status!==undefined&&k!=='forum'?`<span class="tag s${p.status}">${STATUS[p.status]}</span>`:''}
    <div class="n"><b>${money(p.replies)}</b>trả lời</div></a>`}
async function board(kind,page=1){
  const B=BOARD[kind];
  const head=`<div class="page-head"><span class="ico" style="background:${KIND[kind][2]}22">${KIND[kind][1]}</span><div><h1>${B.title}</h1><p>${B.desc}</p></div></div>`;
  const form=me?`<form class="card" id="pf"><h2 style="font-size:24px">${B.btn}</h2>
      ${kind==='report'?'<div class="f"><label for="pt">Tên nhân vật bị tố cáo</label><input id="pt" maxlength="64" required></div>':''}
      <div class="f"><label for="ph">Tiêu đề</label><input id="ph" maxlength="150" minlength="4" required placeholder="${{forum:'Ví dụ: Kinh nghiệm up đệ tử nhanh',report:'Ví dụ: Lừa giao dịch ở Siêu thị',bug:'Ví dụ: Kẹt ở bản đồ Doanh trại',idea:'Ví dụ: Thêm sự kiện câu cá'}[kind]}"></div>
      <div class="f"><label for="pc">Nội dung</label><textarea id="pc" maxlength="5000" minlength="10" required placeholder="${{forum:'Chia sẻ của bạn…',report:'Thời gian, khu vực, diễn biến, bằng chứng (link ảnh / video)…',bug:'Bạn đang làm gì, ở bản đồ / khu nào, lỗi hiện ra sao, có mất đồ không…',idea:'Mô tả ý tưởng và lý do…'}[kind]}"></textarea><span class="hint">Tối đa 5.000 ký tự. Dán link ảnh / video làm bằng chứng nếu có.</span></div>
      <button class="btn p">${B.btn}</button></form>`:needLogin(kind==='forum'?'đăng bài':'gửi phiếu');
  if(kind!=='forum'&&!me){$('#main').innerHTML=head+form;return}
  const d=await api(`posts?kind=${kind}&page=${page}`);
  const list=`<div class="card"><h2 style="font-size:24px">${B.list} <span class="mute" style="font-size:16px">(${money(d.total)})</span></h2>
    <div class="list">${d.rows.length?d.rows.map(r=>postRow({...r,kind})).join(''):'<div class="empty">Chưa có gì ở đây.</div>'}</div>
    ${d.pages>1?`<div class="pager">${Array.from({length:d.pages},(_,i)=>`<button class="btn s ${i+1===d.page?'p':''}" onclick="board('${kind}',${i+1})">${i+1}</button>`).join('')}</div>`:''}</div>`;
  $('#main').innerHTML=head+`<div class="grid g2">${kind==='forum'?list+form:form+list}</div>`;
  const f=$('#pf');if(f)f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;
    const r=await act(()=>api('post/create',{kind,title:$('#ph').value,content:$('#pc').value,target:$('#pt')?.value||''}),'Đã gửi');b.disabled=false;
    if(r)location.hash='#/bai/'+r.id}}
async function postPage(id){
  const p=await api('post?id='+encodeURIComponent(id||''));
  const B=BOARD[p.kind];
  $('#main').innerHTML=`<p><a href="#/${B.route}">← ${B.title}</a></p>
  <article class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="tag" style="color:${KIND[p.kind][2]}">${KIND[p.kind][1]} ${B.title}</span>${p.kind!=='forum'?`<span class="tag s${p.status}">${STATUS[p.status]}</span>`:''}${p.pinned?'<span class="tag s0">📌 Ghim</span>':''}</div>
    <h1 style="font-size:32px">${esc(p.title)}</h1>
    <p class="mute" style="margin-top:0">${esc(p.author)} · ${esc(p.created_at)}${p.target?` · Nhân vật bị tố cáo: <b style="color:var(--red)">${esc(p.target)}</b>`:''}</p>
    <div class="post-body">${esc(p.content)}</div>
  </article>
  <h2 style="margin:24px 0 4px;font-size:24px">${money(p.replyList.length)} trả lời</h2>
  ${p.replyList.map(r=>`<div class="reply ${r.is_admin?'admin':''}"><div class="who">${r.is_admin?'🛡️ ':''}${esc(r.author)}${r.is_admin?' <span class="tag s0">Ban quản trị</span>':''}<span class="mute">${esc(r.created_at)}</span></div><div class="post-body" style="margin-top:6px">${esc(r.content)}</div></div>`).join('')}
  ${me?`<form class="card" id="rf" style="margin-top:16px"><div class="f"><label for="rc">${p.kind==='forum'?'Bình luận':'Bổ sung thông tin'}</label><textarea id="rc" maxlength="2000" minlength="2" required style="min-height:100px"></textarea></div><button class="btn p">Gửi</button></form>`
    :`<div style="margin-top:16px">${needLogin('bình luận')}</div>`}`;
  const f=$('#rf');if(f)f.onsubmit=async e=>{e.preventDefault();if(await act(()=>api('post/reply',{id:p.id,content:$('#rc').value}),'Đã gửi'))postPage(id)}}

const NAP_GEM=[[10000,13,32],[20000,32,82],[50000,91,231],[100000,195,495],[200000,455,1155],[500000,1430,3630],[1000000,3250,8250]];
function napTable(){return `<div class="card" style="margin-bottom:18px"><h2 style="font-size:20px">Bảng giá nạp</h2><table class="nap-tb"><thead><tr><th>Mệnh giá</th><th>X1 nạp</th><th>X3 nạp</th></tr></thead><tbody>${NAP_GEM.map(r=>`<tr><td>${money(r[0])}đ</td><td><img class="pix" src="/icon/932" alt="">${money(r[1])}</td><td><img class="pix" src="/icon/932" alt="">${money(r[2])}</td></tr>`).join('')}</tbody></table><p class="mute" style="margin:8px 0 0;font-size:13px">Cột X3 áp dụng trong đợt khuyến mãi nạp x3. Số tiền khác được tính theo các mệnh giá trên (vd 30.000đ = 32 + 13 ngọc), phần lẻ dưới 10.000đ giữ ở số dư.</p></div>`}
let napTab='bank',napAmount=50000;
async function topup(){
  const t=await api('topup/info');
  const head=`<div class="page-head"><span class="ico" style="background:#ffd25e22"><img class="pix" src="/icon/932" alt="" style="width:40px"></span><div><h1>Nạp ngọc</h1><p>Nạp thành công là ngọc xanh được cộng thẳng vào nhân vật theo bảng giá, trong game sẽ báo "Bạn đã nạp … ngọc vào tài khoản".</p></div></div>`+napTable();
  if(!me){$('#main').innerHTML=head+needLogin('nạp ngọc');return}
  if(!t.bank&&!t.card)napTab='none';else if(napTab==='bank'&&!t.bank)napTab='card';else if(napTab==='card'&&!t.card)napTab='bank';
  $('#main').innerHTML=head+`
  <div class="balance" style="margin-bottom:18px"><img class="pix" src="/icon/4028" alt=""><div><span class="mute">Số dư của <b>${esc(me.username)}</b></span><br><b class="big">${money(me.vnd)}đ</b></div><div style="margin-left:auto;text-align:right"><span class="mute">Tổng đã nạp</span><br><b class="big" style="font-size:20px">${money(me.tongnap)}đ</b></div></div>
  <div class="grid g2">
    <div class="card">
      <div class="tabs" role="tablist">${t.bank?`<button role="tab" class="${napTab==='bank'?'on':''}" onclick="napTab='bank';topup()">🏦 Chuyển khoản QR</button>`:''}${t.card?`<button role="tab" class="${napTab==='card'?'on':''}" onclick="napTab='card';topup()">💳 Thẻ cào</button>`:''}</div>
      <div id="napbox"></div>
    </div>
    <div class="card"><h2 style="font-size:22px">Lịch sử nạp</h2><div id="hist"></div></div>
  </div>`;
  await drawHist();
  const box=$('#napbox');
  if(napTab==='none'){box.innerHTML='<div class="empty">Máy chủ chưa mở nạp. Vui lòng quay lại sau.</div>';return}
  drawNap(t,box)}
async function drawHist(){const hist=await api('topup/history');$('#hist').innerHTML=hist.length?`<div class="tw"><table><thead><tr><th>Lúc</th><th>Cách</th><th>Số tiền</th><th>Trạng thái</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${esc(h.created_at)}</td><td>${h.method==='bank'?'Chuyển khoản':esc(h.telco)}</td><td>${money(h.amount)}đ${h.status===1&&h.credited!==h.amount?`<div class="hint">nhận ${money(h.credited)}đ</div>`:''}</td><td><span class="tag s${[0,2,3][h.status]}">${TOP_STATUS[h.status]}</span>${h.note?`<div class="hint">${esc(h.note)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có giao dịch.</div>'}
function drawNap(t,box){
  const amounts=`<div class="f"><span>Mệnh giá</span><div class="amounts">${t.amounts.map(a=>`<button type="button" class="${a===napAmount?'on':''}" onclick="napAmount=${a};this.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this))">${money(a)}đ</button>`).join('')}</div></div>`;
  if(napTab==='bank'){
    box.innerHTML=`<form id="bf">${amounts}<div class="f"><label for="ba">Hoặc nhập số tiền khác</label><input id="ba" type="number" min="10000" step="1000" placeholder="Tối thiểu 10.000đ"></div>
      <button class="btn p" style="width:100%">Tạo mã QR chuyển khoản</button><p class="hint">Chuyển đúng số tiền và đúng nội dung, ban quản trị kiểm tra rồi cộng tiền (thường trong vài phút).</p></form><div id="qrbox"></div>`;
    $('#bf').onsubmit=async e=>{e.preventDefault();const amount=Number($('#ba').value)||napAmount;
      const r=await act(()=>api('topup/bank',{amount}));if(!r)return;
      const qr=`https://img.vietqr.io/image/${encodeURIComponent(r.bank)}-${encodeURIComponent(r.account)}-compact2.png?amount=${r.amount}&addInfo=${encodeURIComponent(r.memo)}&accountName=${encodeURIComponent(r.owner||'')}`;
      $('#qrbox').innerHTML=`<div class="qr" style="margin-top:18px"><img src="${esc(qr)}" alt="Mã QR chuyển khoản ${money(r.amount)}đ"><dl class="kv">
        <dt>Ngân hàng</dt><dd>${esc(r.bank)}</dd><dt>Số tài khoản</dt><dd>${esc(r.account)} <button type="button" class="copy" data-c="${esc(r.account)}">Chép</button></dd>
        <dt>Chủ tài khoản</dt><dd>${esc(r.owner||'')}</dd><dt>Số tiền</dt><dd style="color:var(--gold)">${money(r.amount)}đ</dd>
        <dt>Nội dung</dt><dd style="color:var(--orange2)">${esc(r.memo)} <button type="button" class="copy" data-c="${esc(r.memo)}">Chép</button></dd></dl></div>`;
      $('#qrbox').querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.c).then(()=>toast('Đã chép')));drawHist()}}
  else{
    box.innerHTML=`<form id="cf"><div class="f"><label for="ct">Nhà mạng</label><select id="ct">${t.telcos.map(x=>`<option>${x}</option>`).join('')}</select></div>${amounts}
      <div class="f"><label for="cs">Số seri</label><input id="cs" inputmode="numeric" maxlength="20" required autocomplete="off"></div>
      <div class="f"><label for="cc">Mã thẻ</label><input id="cc" inputmode="numeric" maxlength="20" required autocomplete="off"></div>
      <button class="btn p" style="width:100%">Nạp thẻ</button><p class="hint">Chọn đúng mệnh giá, sai mệnh giá có thể mất thẻ.${t.cardRate<100?` Thẻ cào nhận ${t.cardRate}% mệnh giá.`:''}</p></form>`;
    $('#cf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
      const r=await act(()=>api('topup/card',{telco:$('#ct').value,amount:napAmount,serial:$('#cs').value,code:$('#cc').value}),'Đã gửi thẻ, đang chờ xử lý');b.disabled=false;
      if(r){await loadMe();topup()}}}}

/* ---------- khởi động ---------- */
(async()=>{
  try{info=await api('status');document.title=info.name+' · Ngọc Rồng Online';$('#sv-name').innerHTML='Ngọc Rồng <b>'+esc(info.name)+'</b>';$('#ft-name').textContent=info.name}catch(e){}
  await loadMe();route()})();
</script>
</body>
</html>
