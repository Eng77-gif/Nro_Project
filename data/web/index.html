<body>
<div class="site">

<footer><p><b>NGỌC RỒNG ONLINE — <span class="sv-name">CỔNG CỘNG ĐỒNG</span></b></p><p>Trò chơi dành cho người từ 12 tuổi trở lên. Chơi quá 180 phút một ngày sẽ ảnh hưởng xấu đến sức khỏe.</p><a href="#/">Trang chủ</a> · <a href="#/bao-loi">Báo lỗi</a> · <a href="#/gop-y">Liên hệ &amp; góp ý</a></footer>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('vi-VN');
const STATUS=['Mới gửi','Đang xử lý','Đã xử lý','Từ chối'];
const TOP_STATUS=['Đang chờ','Thành công','Thất bại'];
const NAP_GEM=[[10000,13,32],[20000,32,82],[50000,91,231],[100000,195,495],[200000,455,1155],[500000,1430,3630],[1000000,3250,8250]];
const ICON={arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',external:'<path d="M6 18 18 6M6 6h12v12"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/>',chat:'<path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 9h8M7 13h5"/>',gem:'<path d="m3 8 4-5h10l4 5-9 13Z" fill="currentColor" fill-opacity=".12"/><path d="M3 8h18M7 3l5 18 5-18M7 3l5 5 5-5"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 11 3 3 5-5"/>',flag:'<path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0"/>',book:'<path d="M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2Z"/>',document:'<path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h6"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',home:'<path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/>',login:'<path d="M13 3h7v18h-7M3 12h12m-4-4 4 4-4 4"/>',logout:'<path d="M11 3H4v18h7M10 12h11m-4-4 4 4-4 4"/>',chevron:'<path d="m6 9 6 6 6-6"/>',bug:'<path d="M8 8h8v9a4 4 0 0 1-8 0ZM9 8V6a3 3 0 0 1 6 0v2M3 10l5 2m8 0 5-2M3 16h5m8 0h5M5 22l4-3m6 0 4 3M12 8v12"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',bank:'<path d="m3 9 9-5 9 5M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>'};
const gem=(s=20)=>`<img class="gem-img" src="/icon/932" width="${s}" height="${s}" alt="" aria-hidden="true">`;
const ic=(n,s=20)=>`<svg class="ui-icon icon-${n}" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON[n]||ICON.spark}</svg>`;
let token='',me=null,info=null;
try{token=localStorage.getItem('nro_token')||''}catch(e){}

async function api(path,body){
  const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Token':token},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({error:'Lỗi kết nối máy chủ'}));
  if(r.status===401&&token){token='';try{localStorage.removeItem('nro_token')}catch(e){}me=null;drawAcc()}
  if(!r.ok)throw new Error(d.error||'Có lỗi xảy ra');
  return d}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3500)}
async function act(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,1)}}
async function getInfo(){if(!info)info=await api('status');return info}

/* ---------- tài khoản (tài khoản chơi game) ---------- */
function drawAcc(){
  $('#acc').innerHTML=me?`<span class="who" title="${esc(me.username)}">${ic('user',14)} ${esc(me.username)}</span><button type="button" onclick="logout()">Thoát</button>`
    :`<button type="button" class="fill" onclick="loginBox()">${ic('login',14)} Đăng nhập</button>`}
async function loadMe(){if(!token){me=null;drawAcc();return}try{me=await api('me')}catch(e){me=null}drawAcc()}
function loginBox(after){
  const d=$('#dialog');
  $('#dialog-body').innerHTML=`<div class="auth-heading"><div class="auth-emblem">${ic('spark')}</div><span class="eyebrow">CỘNG ĐỒNG NGỌC RỒNG</span><h2>Chào mừng chiến binh trở lại.</h2><p>Đăng nhập bằng tài khoản và mật khẩu chơi game.</p></div>
    <form id="auth-form"><label>Tài khoản<input id="lu" required maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label>Mật khẩu<input id="lp" type="password" required maxlength="100" autocomplete="current-password"></label>
    <button class="button green" style="width:100%">${ic('login',16)}&nbsp;Đăng nhập</button><p class="status" id="auth-error" role="alert"></p></form>`;
  d.showModal();$('#lu').focus();
  $('#auth-form').onsubmit=async e=>{e.preventDefault();
    try{const r=await api('login',{user:$('#lu').value.trim(),pass:$('#lp').value});token=r.token;try{localStorage.setItem('nro_token',token)}catch(x){}
      d.close();await loadMe();toast('Xin chào '+me.username);(after||route)()}catch(x){$('#auth-error').textContent=x.message;$('#auth-error').style.color='#a2463a'}}}
async function logout(){await api('logout',{}).catch(()=>{});token='';try{localStorage.removeItem('nro_token')}catch(e){}me=null;drawAcc();route()}

/* ---------- định tuyến ---------- */
const NAV={'':'home','gioi-thieu':'about','dien-dan':'forum','bai':'forum','nap':'gems','bao-loi':'forum','to-cao':'forum','gop-y':'forum'};
const ROUTES={'':home,'gioi-thieu':about,'dien-dan':()=>forum(),'to-cao':()=>support('report'),'bao-loi':()=>support('bug'),'gop-y':()=>support('idea'),'nap':gems,'bai':postPage};
async function route(){
  const parts=location.hash.replace(/^#\/?/,'').split('/'),key=ROUTES[parts[0]]?parts[0]:'';
  document.querySelectorAll('header nav a').forEach(a=>a.classList.toggle('active',a.dataset.r===NAV[key]));
  if($('#dialog').open)$('#dialog').close();
  $('#app').innerHTML='<div class="loading">Đang tải…</div>';
  try{await ROUTES[key](parts[1])}catch(e){$('#app').innerHTML=`<section class="access-gate"><span class="gate-icon">${ic('info')}</span><h2>Không tải được trang</h2><p>${esc(e.message)}</p></section>`}
  window.scrollTo(0,0)}
addEventListener('hashchange',route);

/* ---------- trang chủ ---------- */
const evArt=n=>/halloween|hlw|bí ngô|ma/i.test(n)?'event-halloween.png':/20\/10|tháng 10|phụ nữ|8\/3/i.test(n)?'event-october.png':'hero.png';
let homeFilter='Tất cả';
function newsCards(s){
  const ev=s.events.map(e=>({type:'Sự kiện',title:e.name,text:e.description,art:evArt(e.name),meta:e.end?'Đến hết '+e.end.split('-').reverse().join('/'):'Đang diễn ra',href:'#/dien-dan'}));
  const posts=s.news.map(p=>({type:p.is_admin||p.pinned?'Thông báo':'Thảo luận',title:p.title,text:p.excerpt||'',art:p.is_admin||p.pinned?'event-october.png':'hero.png',meta:esc(p.author)+' · '+esc(p.created_at),href:'#/bai/'+Number(p.id)}));
  const all=[...ev,...posts].filter(x=>homeFilter==='Tất cả'||x.type===homeFilter);
  return all.length?all.map(x=>`<a class="news" href="${x.href}"><div class="news-art"><img src="/assets/${x.art}" alt="" loading="lazy"></div><div class="news-content"><span class="tag">${esc(x.type.toUpperCase())}</span><h3>${esc(x.title)}</h3><span class="muted">${x.meta} <span class="read-more">Đọc bài ${ic('external',14)}</span></span></div></a>`).join('')
    :`<div class="feed-empty"><h3>Chưa có bài phù hợp</h3><p>Chọn "Tất cả" hoặc vào diễn đàn để xem thêm.</p></div>`}
async function home(){

  if(napMethod==='bank'&&!t.bank)napMethod='card';
  const packs=napMethod==='card'?NAP_GEM.filter(p=>(t.amounts||[]).includes(p[0])):NAP_GEM;
  if(napPack>=packs.length)napPack=0;
  const sel=packs[napPack]||NAP_GEM[0];
  $('#app').innerHTML=`<section class="store-heading"><span class="eyebrow">NGỌC RỒNG / NẠP NGỌC</span><h1>Tiếp sức hành trình.</h1><p>Chọn cách nạp và gói ngọc, ngọc được cộng thẳng vào nhân vật.</p></section>
  ${me?`<div class="me-chips"><span>Tài khoản <b>${esc(me.username)}</b></span><span>Tổng đã nạp <b>${money(me.tongnap)}đ</b></span>${me.vnd>0?`<span>Số dư <b>${money(me.vnd)}đ</b></span>`:''}</div>`:''}
  <div class="store-steps"><span class="current"><i>01</i> Cách nạp</span><b>—</b><span class="${me?'current':''}"><i>02</i> Gói ngọc</span><b>—</b><span><i>03</i> Thanh toán</span></div>
  <div class="store-layout"><div class="store-form">
    <section class="store-section"><div class="step-title"><span>01</span><div><h2>Nạp bằng cách nào?</h2><p>${t.bank||t.card?'Chuyển khoản QR được duyệt tự động; thẻ cào được kiểm tra rồi cộng ngọc.':'Máy chủ chưa mở nạp, vui lòng quay lại sau.'}</p></div></div>
      <div class="pay-switch">${t.bank?`<button type="button" data-m="bank" class="${napMethod==='bank'?'on':''}">${ic('bank',18)} Chuyển khoản QR</button>`:''}${t.card?`<button type="button" data-m="card" class="${napMethod==='card'?'on':''}">${ic('card',18)} Thẻ cào</button>`:''}</div>
      ${napMethod==='card'&&t.card?`<div class="form-grid" style="margin-top:16px"><label>Nhà mạng<select id="ct">${t.telcos.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Số seri<input id="cs" inputmode="numeric" maxlength="20" autocomplete="off"></label></div><label>Mã thẻ<input id="cc" inputmode="numeric" maxlength="20" autocomplete="off"></label><p class="price-note" style="text-align:left">Chọn đúng mệnh giá thẻ ở bước 02, sai mệnh giá có thể mất thẻ.${t.cardRate<100?' Thẻ cào nhận '+t.cardRate+'% mệnh giá.':''}</p>`:''}</section>
    <section class="store-section"><div class="step-title"><span>02</span><div><h2>Chọn gói ngọc</h2><p>Khuyến mãi nạp x3 tự áp dụng theo cột X3.</p></div></div>
      <div class="gems luxury-gems">${packs.map((p,i)=>`<button type="button" class="gem ${i===napPack?'selected':''}" data-pk="${i}" aria-pressed="${i===napPack}"><span class="selection-tick" aria-hidden="true">${ic('check',12)}</span><span class="gem-art" aria-hidden="true">${gem(34)}</span><strong>${money(p[1])} <small>ngọc</small></strong><span class="gem-x3">X3: ${money(p[2])} ngọc</span><span class="gem-price">${money(p[0])} <small>đ</small></span></button>`).join('')}</div>
      <p class="price-note">Chuyển khoản số tiền khác được cộng theo các mệnh giá trên (30.000đ = 32 + 13 ngọc).</p></section>
    <section class="store-section"><div class="step-title"><span>${gem(14)}</span><div><h2>Bảng giá nạp</h2><p>Số ngọc nhận được theo từng mệnh giá.</p></div></div>
      <table class="nap-tb"><thead><tr><th>MỆNH GIÁ</th><th>X1 NẠP</th><th>X3 NẠP</th></tr></thead><tbody>${NAP_GEM.map(r=>`<tr><td>${money(r[0])}đ</td><td><img src="/icon/932" alt="">${money(r[1])}</td><td><img src="/icon/932" alt="">${money(r[2])}</td></tr>`).join('')}</tbody></table>
      <p class="price-note">X3 áp dụng trong đợt khuyến mãi nạp x3. Số tiền khác cộng theo các mệnh giá trên (30.000đ = 32 + 13 ngọc).</p></section>
    <section class="store-help"><span>${ic('info',18)}</span><p>Cần trợ giúp? <a href="#/bao-loi">Gửi yêu cầu hỗ trợ ${ic('external',12)}</a><br>Chuyển khoản đúng số tiền và đúng nội dung để được cộng tự động.</p></section></div>
  <aside class="order-column"><section class="order-card"><div class="order-top"><span class="eyebrow">LỰA CHỌN CỦA BẠN</span><h2>Chi tiết gói ngọc</h2><span class="order-mark">${gem(60)}</span></div><div class="order-content">
    <div class="order-gem"><span>${gem(22)}</span><div><b>${money(sel[1])} ngọc</b><small>Khuyến mãi x3: ${money(sel[2])} ngọc</small></div></div>
    <dl><div><dt>Tài khoản</dt><dd>${me?esc(me.username):'Chưa đăng nhập'}</dd></div><div><dt>Cách nạp</dt><dd>${napMethod==='bank'?'Chuyển khoản QR':'Thẻ cào'}</dd></div></dl>
    <div class="order-total"><span>Tổng thanh toán</span><strong>${money(sel[0])} <small>đ</small></strong></div>
    <button class="button order-submit" type="button" id="paygo" ${t.bank||t.card?'':'disabled'}>${!me?'Đăng nhập để nạp':napMethod==='bank'?'Tạo mã QR chuyển khoản':'Nạp thẻ'} <span>${ic('arrow',16)}</span></button>
    <div id="qrbox"></div><p class="order-disclaimer">${napMethod==='bank'?'Chuyển đúng nội dung, ngọc được cộng sau vài giây.':'Thẻ được kiểm tra rồi cộng ngọc, thường trong vài phút.'}</p></div></section>
    <details class="store-faq"><summary>Bao lâu thì nhận được ngọc?</summary><p>Chuyển khoản đúng số tiền và nội dung: vài giây. Thẻ cào: sau khi thẻ được kiểm tra. Đang online sẽ thấy thông báo "Bạn đã nạp … ngọc vào tài khoản", đang offline thì nhận khi vào game.</p></details>
    <details class="store-faq"><summary>Chuyển sai nội dung thì sao?</summary><p>Tiền vẫn được ghi nhận nhưng không tự cộng. Hãy gửi Báo lỗi kèm ảnh giao dịch để ban quản trị kiểm tra.</p></details></aside></div>
  <section class="store-section" style="margin-top:22px"><div class="step-title"><span>03</span><div><h2>Lịch sử nạp</h2><p>Các yêu cầu nạp gần đây của bạn.</p></div></div><div id="hist">${me?'<div class="loading">Đang tải…</div>':'<p class="muted" style="font-size:12px">Đăng nhập để xem lịch sử nạp.</p>'}</div></section>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{napMethod=b.dataset.m;gems()});
  document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{napPack=+b.dataset.pk;gems()});
  $('#paygo').onclick=()=>{if(!me)return loginBox();napMethod==='bank'?payBank(sel[0]):payCard(sel[0])};
  if(me)drawHist()}
async function payBank(amount){
  const r=await act(()=>api('topup/bank',{amount}));if(!r)return;
  const qr=`https://img.vietqr.io/image/${encodeURIComponent(r.bank)}-${encodeURIComponent(r.account)}-compact2.png?amount=${r.amount}&addInfo=${encodeURIComponent(r.memo)}&accountName=${encodeURIComponent(r.owner||'')}`;
  $('#qrbox').innerHTML=`<div class="qr-box"><img src="${esc(qr)}" alt="Mã QR chuyển khoản ${money(r.amount)}đ"><dl><div><dt>Ngân hàng</dt><dd>${esc(r.bank)}</dd></div><div><dt>Số tài khoản</dt><dd>${esc(r.account)}<button type="button" class="copy" data-c="${esc(r.account)}">Chép</button></dd></div><div><dt>Chủ tài khoản</dt><dd>${esc(r.owner||'')}</dd></div><div><dt>Số tiền</dt><dd>${money(r.amount)}đ</dd></div><div><dt>Nội dung</dt><dd>${esc(r.memo)}<button type="button" class="copy" data-c="${esc(r.memo)}">Chép</button></dd></div></dl></div>`;
  $('#qrbox').querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.c).then(()=>toast('Đã chép')));drawHist()}
async function payCard(amount){
  const s=$('#cs').value.trim(),c=$('#cc').value.trim();if(!s||!c)return toast('Nhập số seri và mã thẻ',1);
  const b=$('#paygo');b.disabled=true;const r=await act(()=>api('topup/card',{telco:$('#ct').value,amount,serial:s,code:c}),'Đã gửi thẻ, đang chờ xử lý');b.disabled=false;
  if(r){await loadMe();gems()}}
async function drawHist(){const h=await api('topup/history').catch(()=>[]);$('#hist').innerHTML=h.length?`<table class="hist"><thead><tr><th>Lúc</th><th>Cách</th><th>Số tiền</th><th>Trạng thái</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${x.method==='bank'?'Chuyển khoản':esc(x.telco)}</td><td>${money(x.amount)}đ</td><td><span class="st s${[0,2,3][x.status]}">${TOP_STATUS[x.status]}</span>${x.note?`<small>${esc(x.note)}</small>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="muted" style="font-size:12px">Chưa có giao dịch.</p>'}

/* ---------- khởi động ---------- */
$('#dialog .close').onclick=()=>$('#dialog').close();
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});
(async()=>{try{const s=await getInfo();document.title=s.name+' · Ngọc Rồng Online';document.querySelectorAll('.sv-name').forEach(e=>e.textContent=s.name)}catch(e){}
  await loadMe();route()})();

</script>
</body>
</html>
