async function api(path,body){
  const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Token':token},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({error:'Lỗi kết nối máy chủ'}));
  if(r.status===401&&token){token='';try{localStorage.removeItem('nro_token');sessionStorage.removeItem('nro_token')}catch(e){}me=null;}
  if(!r.ok)throw new Error(d.error||'Có lỗi xảy ra');
  return d}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3500)}
async function act(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,1)}}

    $('#pass2-row').hidden=!reg;$('#lp2').required=reg;$('#lp').autocomplete=reg?'new-password':'current-password';
    form.querySelector('.world-submit').innerHTML=ic(reg?'shield':'login',19)+(reg?' ĐĂNG KÝ NGAY':' ĐĂNG NHẬP NGAY');

async function about(){
  $('#app').innerHTML=`<div class="support-links"><a href="#/to-cao">Tố cáo vi phạm</a> · <a href="#/bao-loi">Báo lỗi game</a> · <a href="#/gop-y">Đóng góp ý kiến</a></div>
  <article class="nro-guide"><div class="guide-top"><a href="#/dien-dan">← Diễn đàn</a><h1>Sơ lược về Chú Bé Rồng Online</h1><p>Từ bước chọn hành tinh đến lần đầu bước lên võ đài.</p></div><details><summary>Mục lục hướng dẫn</summary><button data-jump="0">1. Khởi đầu</button><button data-jump="1">2. Làng và NPC</button><button data-jump="2">3. Nhiệm vụ</button><button data-jump="3">4. Kỹ năng</button><button data-jump="4">5. Hành trang</button><button data-jump="5">6. Di chuyển</button><button data-jump="6">7. Đệ tử</button><button data-jump="7">8. Thi đấu</button><button data-jump="8">9. Nâng cấp</button><button data-jump="9">10. Bang hội</button></details><section id="guide-0"><h2>1. Chọn nhân vật</h2><p>Chọn Trái Đất, Namek hoặc Xayda khi tạo nhân vật. Tên hành tinh và chân dung trên màn hình chọn giúp bạn nhận ra lựa chọn của mình.</p><img loading="lazy" src="${guideArt.choose}" alt="Chọn nhân vật"></section><section id="guide-1"><h2>2. Làm quen với làng</h2><p>Chạm vào NPC để trò chuyện. Xem tên bản đồ và khu trước khi hẹn bạn bè gặp nhau.</p><img loading="lazy" src="${guideArt.village}" alt="Làm quen với làng"></section><section id="guide-2"><h2>3. Theo dõi nhiệm vụ</h2><p>Mở mục Nhiệm vụ, đọc tên NPC hoặc mục tiêu đang được giao. Quay lại gặp NPC sau khi hoàn thành yêu cầu.</p></section><section id="guide-3"><h2>4. Luyện tập và dùng chiêu</h2><p>Chọn mục tiêu rồi sử dụng ô kỹ năng trên thanh dưới. Để ý thanh KI trước khi dùng chiêu tiếp theo.</p></section><section id="guide-4"><h2>5. Trang bị và vật phẩm</h2><p>Mở Hành trang, chạm vào vật phẩm để xem mô tả và chỉ số. Kiểm tra điều kiện sử dụng trước khi thay trang bị.</p><img loading="lazy" src="${guideArt.bag}" alt="Trang bị và vật phẩm"></section><section id="guide-5"><h2>6. Bay giữa các khu vực</h2><p>Quan sát lối ra ở rìa bản đồ. Khi bay, để ý thanh KI và điểm đáp để tiếp tục hành trình.</p><img loading="lazy" src="${guideArt.flight}" alt="Bay giữa các khu vực"></section><section id="guide-6"><h2>7. Đồng hành cùng đệ tử</h2><p>Sau khi có đệ tử, mở mục Đệ tử để xem sức mạnh, trang bị và trạng thái. Chọn lệnh phù hợp khi luyện quái.</p><img loading="lazy" src="${guideArt.disciple}" alt="Đồng hành cùng đệ tử"></section><section id="guide-7"><h2>8. Võ đài và giải đấu</h2><p>Gặp NPC tại võ đài để xem giải đang mở, điều kiện đăng ký và thời gian đến lượt.</p><img loading="lazy" src="${guideArt.arena}" alt="Võ đài và giải đấu"></section><section id="guide-8"><h2>9. Trang bị và pha lê</h2><p>Đọc kỹ vật phẩm cần dùng, chi phí và kết quả dự kiến trong hộp xác nhận trước khi nâng cấp.</p><img loading="lazy" src="${guideArt.upgrade}" alt="Trang bị và pha lê"></section><section id="guide-9"><h2>10. Hoạt động cùng bang</h2><p>Thống nhất bản đồ và khu với đồng đội trước khi vào hoạt động. Theo dõi thông báo trong bang để biết giờ tập hợp.</p></section></article><section hidden><h2>Giới thiệu</h2><p>Bước vào thế giới Ngọc Rồng, lựa chọn nhân vật đến từ Trái Đất, Namek hoặc Xayda và bắt đầu cuộc phiêu lưu cùng bạn bè.</p><p>Luyện công, săn boss, giành Ngọc Rồng Sao Đen cùng bang hội, thu nhận đệ tử và tham gia sự kiện mỗi mùa. Cộng đồng là nơi tìm đồng đội, trao đổi kinh nghiệm và chia sẻ những khoảnh khắc đáng nhớ.</p><h3>Ba hành tinh — ba hành trình</h3><ul><li><b>Trái Đất:</b> cân bằng, chiêu Kamejoko và Thái Dương Hạ San, dễ chơi cho người mới.</li><li><b>Namek:</b> hồi phục và hỗ trợ đồng đội, đệ tử mạnh, chiêu Masenko.</li><li><b>Xayda:</b> sát thương cao, biến khỉ, chiêu Galick và Kaioken.</li></ul><div class="characters"><figure><img src="/assets/gif_maphongba.gif" alt="Nhân vật thi triển chiêu thức"><figcaption>Luyện tập</figcaption></figure><figure><img src="/assets/gif_gif_Saiyain.gif" alt="Chiến binh Xayda biến hình"><figcaption>Bứt phá</figcaption></figure><figure><img src="/assets/gif_supber_kame.gif" alt="Nhân vật sử dụng kỹ năng năng lượng"><figcaption>Chinh phục</figcaption></figure></div></section>
  <section class="classic-section"><h2>Luật chơi</h2><ul><li>Không dùng phần mềm thứ ba, hack, auto ngoài tính năng có sẵn trong game.</li><li>Không lừa đảo, mua bán tài khoản, vật phẩm bằng tiền thật ngoài kênh nạp chính thức.</li><li>Không xúc phạm, phân biệt, spam trên kênh chat thế giới và diễn đàn.</li><li>Gặp lỗi game hãy <a href="#/bao-loi"><b>báo lỗi</b></a>, không lợi dụng lỗi để trục lợi.</li><li>Thấy vi phạm hãy <a href="#/to-cao"><b>tố cáo</b></a> kèm bằng chứng, ban quản trị sẽ xử lý.</li></ul><div class="help-menu"><a href="#/dien-dan">Tham gia diễn đàn »</a><a href="#/gop-y">Chia sẻ góp ý »</a></div></section>`;document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById('guide-'+b.dataset.jump).scrollIntoView())}

const importedEvents={"SỰ KIỆN CHÀO MỪNG NGÀY NHÀ GIÁO VIỆT NAM": {"body": "Chào các Cư Dân,\nAdmin sẽ tiến hành bảo trì để cập nhật nội dung chuỗi sự kiện mừng Ngày Nhà giáo Việt Nam 20/11.\nThời gian: Từ ngày 19/11/2026 đến hết ngày 17/12/2026.\nNội dung:\n\n1/ KHUYẾN MÃI X3\n**A. KHUYẾN MÃI TIỀM NĂNG SỨC MẠNH**\nX3 TNSM toàn bộ máy chủ đến hết ngày 22/11/2026.\n**B. KHUYẾN MÃI X3 GIÁ TRỊ THẺ NẠP**\nThời gian: Từ 00h05 ngày 21/11/2026 đến 23h59 ngày 22/11/2026.\nÁp dụng cho các máy chủ Việt Nam. (Không áp dụng cho máy chủ 15 Sao)\n\n2/ TÍCH ĐIỂM ĐỔI QUÀ TẠI NPC QUY LÃO\nThời gian: Từ 00h05 ngày 20/11/2026 đến hết ngày 27/11/2026.\nTất cả vật phẩm đều có hạn sử dụng và vĩnh viễn.\n\n3/ TRÀ THƯỢNG HẠNG BIẾU THẦY CÔ\n**A&gt; Tìm nguyên liệu**\nTự tay tìm những lá trà tươi, phơi khô, ướp trà để làm những hộp trà thượng hạng tặng cho các thầy cô nhân Ngày Nhà giáo Việt Nam 20/11.\n- Lá Trà Tươi: Đánh quái ở Đông Karin, Thung Lũng Namec, Thung Lũng Nappa, Vực Cấm, Núi Appule. Mỗi ngày có thể nhặt tối đa x999.\n- Nia Tre [Ký gửi vàng]: Các bạn tham gia phó bản và hạ siêu quái, Boss để có cơ hội nhận được. Mỗi ngày nhặt tối đa x999.\n- Que Tre [Ký gửi ngọc]: Các bạn cần làm nhiệm vụ khó hoặc siêu khó tại NPC Bò Mộng để nhận được.\n- Hoa Cúc: Hạ ngục các Boss để có cơ hội nhận ngẫu nhiên hoặc mua tại NPC Santa.\nKhi thu thập đủ x99 Lá Trà Tươi, Cư Dân đến NPC Bà Hạt Mít để tiến hành sấy khô lá trà theo công thức gia truyền và nhận được x1 Túi Trà Khô [Ký gửi ngọc].\nCư Dân có thể đợi 90 giây để sấy khô hoặc dùng 5 triệu vàng để sấy khô cấp tốc.\n**B&gt; Chế biến hộp trà tại NPC Quy Lão**\n- Hộp Trà Bình Thường - Ký gửi vàng (có thể giao dịch).\n- Hộp Trà Hoa Cúc - Ký gửi vàng (có thể giao dịch).\n**C&gt; Tặng trà**\nCư Dân đến Đảo Kame gặp Quy Lão để tiến hành tặng trà.\n- Mở Hộp Trà Bình Thường sẽ nhận được các vật phẩm hạn sử dụng và vĩnh viễn.\n- Mở Hộp Trà Hoa Cúc sẽ nhận được Sách Giáo Khoa. Mở Sách Giáo Khoa sẽ nhận được vật phẩm hạn sử dụng và vĩnh viễn.\nVật phẩm mới: Cải Trang Gohan Trung Học Mới.\n\n4/ CHẾ TẠO THIỆP CHÚC THẦY CÔ\n**A&gt; Tìm nguyên liệu**\n- Bao Bì Thiệp: Mua tại NPC Chi Chi.\n- Mảnh Giấy [Ký gửi vàng]: Đánh quái ở các map rừng sẽ rơi (Rừng Bamboo, Rừng Dương Xỉ, Rừng Cọ, Rừng Đá). Mỗi ngày nhặt tối đa x999.\n- Keo Dán [Ký gửi vàng]: Hạ ngục Ốc Sên ở Trái Đất.\n- Lời Chúc: Khi nhấp vào mục Menu của người chơi khác, mục Xin Lời Chúc sẽ xuất hiện ngẫu nhiên. Mỗi ngày chỉ xin được tối đa 10 lời chúc.\n**B&gt; Làm thiệp**\nKhi thu thập đủ nguyên liệu, Cư Dân đến NPC Bà Hạt Mít để tiến hành làm thiệp.\n- Thiệp Chúc Thường - Ký gửi vàng.\n- Thiệp Chúc Đặc Biệt - Ký gửi ngọc.\nSau khi chế tạo được thiệp chúc mừng, các bạn hãy sử dụng để mọi người cùng chiêm ngưỡng thiệp của mình nhé!\n- Thiệp Chúc Thường: Mở ra các vật phẩm có hạn sử dụng hoặc vĩnh viễn.\n- Thiệp Chúc Đặc Biệt: Mở ra các vật phẩm có hạn sử dụng hoặc vĩnh viễn và Pet Capybara Hồng vĩnh viễn.\n\n5/ HÁI HOA TẶNG SƯ PHỤ\n**A&gt; Nguyên liệu**\nTrong thời gian này, những bụi hoa hồng xinh đẹp sẽ xuất hiện ngẫu nhiên ở khắp nơi. Cư Dân dùng Kéo Tỉa Hoa để có thể hái những bông hoa xinh đẹp nhất tặng thầy cô nhé!\nKéo Tỉa Hoa được bán tại NPC Chi Chi.\nSau khi tỉa thành công, các bạn sẽ nhận được x1 Đóa Hoa Hồng.\n**B&gt; Tặng hoa**\nCư Dân đến gặp thầy Whis tại khu vực Thần Vũ Trụ để tặng hoa.\n- Sử dụng x1 Đóa Hoa: x2 TNSM cho sư phụ và đệ tử trong vòng 30 phút.\n- Sử dụng x10 Đóa Hoa: Nhận thêm 1 phần quà ngẫu nhiên trong các món quà đặc biệt (may mắn nhận Cải Trang Videl Trung Học hạn sử dụng hoặc vĩnh viễn).\n\n6/ SĂN DANH HIỆU GÕ ĐẦU TRẺ\nCư Dân sẽ nhận được Danh Hiệu Gõ Đầu Trẻ khi hoàn thành 1 trong những điều kiện sau đây trong vòng 1 ngày:\n- Tặng x99 Hộp Trà Hoa Cúc.\n- Tặng x49 Thiệp Chúc Đặc Biệt.\n- Tặng x49 Hoa.\nPhần thưởng: Danh Hiệu Gõ Đầu Trẻ có hạn sử dụng 60 ngày.\n\n7/ SHOP TẠI CHI CHI\nMở bán các vật phẩm sự kiện (đặc biệt là Cải Trang Nhà Giáo).\n\n8/ VÒNG QUAY THƯỢNG ĐẾ\n- Bó Hoa Hồng.\n- Bó Hoa Vàng.\n- Cải Trang Bulma Ả Rập.\n- Bút Chì Hồng.\n- Hematite (khóa).\n\n9/ ĐUA TOP\n**A. TOP HỘP QUÀ 20/11 VIP (ĐỔI ĐIỂM NPC QUY LÃO)**\n- TOP 1: Ván Bút Chì Bay vĩnh viễn, Sách Cũ x70, Capsule 1 món kích hoạt x3, 3 Capsule vỡ, 999 Item Tà Ác, 2 Con Dấu VIP.\n- TOP 2: Ván Bút Chì Bay vĩnh viễn, Sách Cũ x60, Capsule 1 món kích hoạt x2, 2 Capsule vỡ, 500 Item Tà Ác, 1 Con Dấu VIP.\n- TOP 3: Ván Bút Chì Bay vĩnh viễn, Sách Cũ x50, Capsule 1 món kích hoạt x1, 1 Capsule vỡ, 200 Item Tà Ác.\n- TOP 4-10: Ván Bút Chì Bay vĩnh viễn, Sách Cũ x20, Phiếu đổi Capsule x50, 250 Mảnh Capsule vỡ, 20 Item Tà Ác.\n- TOP 11-50: Ván Bút Chì Bay 180 ngày, Sách Cũ x10, Phiếu đổi Capsule x20, 100 Mảnh Capsule vỡ.\n- TOP 51-100: Ván Bút Chì Bay 90 ngày, Sách Cũ x5, Phiếu đổi Capsule x10, 20 Mảnh Capsule vỡ.\nĐặc biệt: TOP 1 đạt 25.000 điểm nhận thêm Hộp Quà Set Kích Hoạt 5 Sao và 1 món SKH Beerus tự chọn (ngẫu nhiên cấp 10-12).\n**B. ĐUA TOP GIẤY TỐT NGHIỆP (TOP NGỌC)**\n- TOP 1: Cải Trang Buma Đường Phố vĩnh viễn, Sách Cũ x70, Capsule 1 món kích hoạt x3, 3 Capsule vỡ, 10 Khóa Chỉ Số 1 Bông Tai Cấp 3, 2 Con Dấu VIP, 1 Giáp Luyện Tập Cấp 5.\n- TOP 2: Cải Trang Buma Đường Phố vĩnh viễn, Sách Cũ x60, Capsule 1 món kích hoạt x2, 2 Capsule vỡ, 5 Khóa Chỉ Số 1 Bông Tai Cấp 3, 1 Con Dấu VIP.\n- TOP 3: Cải Trang Buma Đường Phố vĩnh viễn, Sách Cũ x50, Capsule 1 món kích hoạt x1, 1 Capsule vỡ, 2 Khóa Chỉ Số 1 Bông Tai Cấp 3.\n- TOP 4-10: Cải Trang Buma Đường Phố 365 ngày, Sách Cũ x20, Phiếu đổi Capsule x50, 100 Mảnh Capsule vỡ.\n- TOP 11-50: Cải Trang Buma Đường Phố 90 ngày, Sách Cũ x10, Phiếu đổi Capsule x20, 20 Mảnh Capsule vỡ.\n- TOP 51-100: Cải Trang Buma Đường Phố 30 ngày, Sách Cũ x5, Phiếu đổi Capsule x10.\nĐặc biệt: TOP 1 đạt 41.250 điểm nhận thêm 1 món SKH Beerus tự chọn (ngẫu nhiên cấp 10-12).\n**C. ĐUA TOP HỘP THÁNG 20/11 (TOP VÀNG)**\n- TOP 1: Ra Đa Ngọc Rồng VIP 100, Đá Bảo Vệ x60, Capsule 1 món kích hoạt x3, 3 Capsule vỡ, 10.000 Mảnh vỡ Bông Tai Cấp 3, 10 Khóa Chỉ Số 1 Bông Tai Cấp 3, 1 Viên Sao Pha Lê 10% Vàng\n- TOP 2: Ra Đa Ngọc Rồng VIP 50, Đá Bảo Vệ x40, Capsule 1 món kích hoạt x2, 2 Capsule vỡ, 5.000 Mảnh vỡ Bông Tai Cấp 3, 5 Khóa Chỉ Số 1 Bông Tai Cấp 3, 1 Viên Sao Pha Lê 9% Vàng\n- TOP 3: Ra Đa Ngọc Rồng VIP 30, Đá Bảo Vệ x30, Capsule 1 món kích hoạt x1, 1 Capsule vỡ, 1.000 Mảnh vỡ Bông Tai Cấp 3, 2 Khóa Chỉ Số 1 Bông Tai Cấp 3.\n- TOP 4-10: Ra Đa Ngọc Rồng VIP 20, Đá Bảo Vệ x20, Phiếu đổi Capsule x50, 100 Mảnh Capsule vỡ.\n- TOP 11-50: Ra Đa Ngọc Rồng VIP 10, Đá Bảo Vệ x10, Phiếu đổi Capsule x20, 20 Mảnh Capsule vỡ.\n- TOP 51-100: Ra Đa Ngọc Rồng VIP 5, Đá Bảo Vệ x5, Phiếu đổi Capsule x10.\nĐặc biệt: TOP 1 Trên 65.000 điểm nhận thêm Hộp Quà Set Kích Hoạt 3 Sao.\n**D. ĐUA TOP TẶNG BỘ NGỌC RỒNG CHO QUY LÃO**\nQuy đổi: 1 Bộ Ngọc Rồng = 1 điểm.\n- TOP 1: Ván Rồng 7 Sao vĩnh viễn, Sách Cũ x70, Capsule 1 món kích hoạt x3, 3 Capsule vỡ, 10.000 Mảnh vỡ Bông Tai Cấp 3, 10 Khóa Chỉ Số 1 Bông Tai Cấp 3, Giáp luyện tập cấp 5.\n- TOP 2: Ván Rồng 7 Sao vĩnh viễn, Sách Cũ x60, Capsule 1 món kích hoạt x2, 2 Capsule vỡ, 5.000 Mảnh vỡ Bông Tai Cấp 3, 5 Khóa Chỉ Số 1 Bông Tai Cấp 3.\n- TOP 3: Ván Rồng 7 Sao vĩnh viễn, Sách Cũ x50, Capsule 1 món kích hoạt x1, 1 Capsule vỡ, 1.000 Mảnh vỡ Bông Tai Cấp 3, 2 Khóa Chỉ Số 1 Bông Tai Cấp 3.\n- TOP 4-10: Ván Rồng 7 Sao vĩnh viễn, Sách Cũ x20, Phiếu đổi Capsule x50, 100 Mảnh Capsule vỡ.\n- TOP 11-50: Ván Rồng 7 Sao 90 ngày, Sách Cũ x10, Phiếu đổi Capsule x20, 20 Mảnh Capsule vỡ.\n- TOP 51-100: Ván Rồng 7 Sao 60 ngày, Sách Cũ x5, Phiếu đổi Capsule x10.\n\n10/ NHIỆM VỤ KOL\nChuỗi nhiệm vụ siêu hấp dẫn!\nThời gian: Từ ngày 19/11 đến 17/12/2026.\n- Nạp 450 ngọc xanh để nhận phần thưởng VIP.\nLưu ý:\n- Yêu cầu sức mạnh trên 50 triệu.\n- Cấp độ phó bản phải trên cấp 50.", "age": "3 ngày trước"}, "SỰ KIỆN HALLOWEEN 2026": {"body": "Chào các Cư Dân,\nAdmin tiến hành update các nội dung Sự Kiện Halloween.\nThời gian: Sau bảo trì ngày 31/10/2026 đến hết 23h59 ngày 17/11/2026.\nNội dung bao gồm như sau:\n\n1. KHUYẾN MÃI X3 GIÁ TRỊ THẺ NẠP \u003cimg class=\"inlin n/+wXq2xMrlQjt+0AAAAASUVORK5CYII=\">\nCác Cư Dân cần phải thu thập đầy đủ những viên Ngọc Bí để gọi Rồng Xương ban một điều ước.\nTrong những ngày bầu trời đen tối sẽ xuất hiện các Dơi Nhí, Bộ Xương, Ma Trơi manh động đánh bất cứ ai mà chúng bắt gặp và truyền bệnh để nạn nhân trở thành một trong số chúng.\nKhi hạ những âm binh này, các bạn sẽ có cơ hội nhận được Ngọc Bí.\nA. TÌM NGỌC BÍ:\n- Mỗi ngày đăng nhập đánh quái sẽ nhận được các Ngọc Bí.\n- Hoàn thành 3 nhiệm vụ siêu khó trong ngày của Bò Mộng để có cơ hội nhận ngẫu nhiên x1 Ngọc Bí từ 7 sao đến 1 sao.\n- Hoàn thành 1 phó bản (đánh Boss kết thúc phó bản) sẽ nhận ngẫu nhiên x1 Ngọc Bí từ 7 sao đến 1 sao.\n- Hạ các Boss Xên, Black, Cumber để nhận ngẫu nhiên Ngọc Bí từ 7 sao đến 1 sao.\n- Sử dụng Radar để tìm Ngọc Bí dễ dàng hơn, giá Shop bán 30 ngọc, thời gian sử dụng Radar là 60 phút.\n- Khi đánh Dơi Nhí, Ma Trơi, các bạn phải có x1 Túi Đựng Ngọc trong hành trang. Nếu hạ được Boss thì sẽ nhận được Ngọc Bí, đồng thời Túi Đựng Ngọc sẽ bị mất.\n\u003cimg class=\"inline-emote\" alt=\"\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAAXNSR0IArs4c6QAAAnBJREFUSIm1VD1rU1EYfs5NmhqUEiSKtH7gkDjpIpitNaNNsjg2g2Dm9ic03Mm5k4tSB92Fa1ZNOgh3KIJb0kF6SQoWEtOWG3KvJK+DeU/O/UwdfOByz8d7nuf9OgeYg5QPvvUohNl6ODR117Zt2LYNn5FYICLt+bxlWVKcBeii9xP98o4U0g3zMt4LAKQbJjuGfnkH15PL0ijJg6u3svg1MwCA8rtXgGFi78UzGgwGSCQSlE6nQUQYjUYgImSzWdreb6D86L48BwDt3yIo8K3bxw3Fvcf3bgIAdMNEvVLA7sevHvfrlQK29xuoVwqoA7CKtZhgATo8PiWrWCOrWJOF0g2TGABCx7phSns+f3h8GmgWKRBGPplMAgLj8Zhym1uU29wKiCjzeRd9+v4Dd7+8lWnZLT+R6pqm4S/vzBsiPHz+Us7fv97jppAcgRowmu0uNvJryJeqcq3T+OCx4T11PV+qotnu4umD28ECqGlptrtEROQ4DrmuK9OgQp27rkuO4xARUbPd9aRLRpDJZDAcDqVaq9OTnnBq8qVqIBIASKVSMnIVzMkNS7phYj23Ck3TsJ5blYZCCI9Q3PrB0Qmm0ykOjk5QrxQAQHieCgAeciYgIknI5LwedxbwvUVRBVqE87GL87EbyeHp+TjwRboMuNiyTVudHjbya7Ge3vn8JnKP08ZcDJmiK0tJzwYfiiPkfT/58tL8enm6iCPgf5yAWmAWYAdbnV50F6khcqeEfVHkgUhVp9QoGIvqIoTwXDLVe78AoDyxYWJRUEgDjkcneSbGQv56cFoU4lCuOAGPEABcW1mBEAIXZ2f/yvH/8AeGKhKiyhjaPQAAAABJRU5ErkJggg==\"> Chú ý: Mỗi ngày chỉ nhặt được x50 mỗi loại Ngọc Bí.\n- Ngọc Bí có thể ký gửi bằng ngọc.\n- Túi Đựng Ngọc: Bán ở NPC Santa.\n- Dơi Nhí: Ngẫu nhiên ở các map Làng Aru, Làng Kakarot, Làng Mori, Vách Núi.\n- Ma Trơi: Ngẫu nhiên ở các map Siêu Thị, Thung Lũng Phía Bắc, Thị Trấn Ginder.\nB. ĐIỀU ƯỚC\nKhi đủ bộ Ngọc Rồng Bí, các bạn sẽ nhận được Điều Ước Mới 2026.\n\n4. CHO KẸO HAY BỊ GHẸO\nTrong thời gian diễn ra lễ hội Halloween sẽ xuất hiện Bí Ma, các Cư Dân cần săn Bí Ma để nhặt những Kẹo Bàn Tay.\n- Bí Ma sẽ xuất hiện thường xuyên tại những nơi âm u, hẻo lánh, Nam Guru, Nam Kame, nơi vắng người, Thung Lũng Đen.\n- Kẹo Bàn Tay có thể ký gửi bằng vàng.\n- Giấy Trang Trí Halloween có bán tại NPC Chi Chi.\n- Giỏ Đựng Kẹo Trái Bí có bán tại NPC Chi Chi.\n- Đánh quái mỗi ngày để nhặt kẹo, có giới hạn trong ngày.\nNgoài ra, Kẹo Bàn Tay có thể xin từ những NPC khác. Khi mặc Cải Trang Ma Quỷ mới có thể xin được kẹo.\n(YÊU CẦU SỨC MẠNH HƠN 10 TỶ)\nSau khi tìm được x99 Kẹo Bàn Tay, các player phải chế tạo thành Hộp Kẹo Ma Quỷ tại NPC Bà Hạt Mít.\n[Hộp Kẹo Ma Quỷ]\n- x99 Kẹo Bàn Tay.\n- x1 Giỏ Đựng Kẹo Trái Bí.\n- x3 Giấy Trang Trí Halloween.\nDùng x1 Hộp Kẹo Ma Quỷ quy đổi tại NPC Bà Hạt Mít (Đảo Kame) có thể nhận được 1 Kẹo Mù.\nMở viên kẹo để nhận các phần quà.\n\u003cimg class=\"inline-emote\" alt=\"\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAAXNSR0IArs4c6QAAAnBJREFUSIm9VTFr20AU/i62nIqWYIpbSmpOdEi9delgCCG1hw4F+y/Ug+fkJ1Ro8txfkJJfUBAZ2ix2B4OG0KFkkDNJ2IUG7DoEG9vFvC65s0462enSDwR3T99737t770nAfwRFnrh9nc/aGFvRt5PJBJPJBDES2yAi+cI/DEMpLgTodvALw9qxFHJc7z7ZMwDkuJ5IDMPaMR5ntyUpKxYPnxXw+44AALVPLcD18LHxjkajETKZDJmmCSLCdDoFEaFQKNDRyRlqr15IPwDw/7CkwPf+EE8i6b22ngIAHNeDXS/jw+eukr5dL+Po5Ax2vQwbQFhtrjksQBfBNYXVJoXVpiyU43okAEC7dlxP8oX/RXCdaBYpoAu+XC4TArPZLFUksl8JREmO6xHnXD5piHLi/kIgixjafh/v3+4jCAJpsyxL2etslmWh7fdRKRX1NYhmTkQ0n89psVgo2erWi8WC5vO5tEdPAtzNQT6fTyjmcjkYhqHNJgrDMJDL5RJ2EXMLAMbjMRzXw+He7saAm3C4twvH9TAej1cCUQRBAMuyFFv8vu/DEVCKXCkV0ekNEgF     <label>Tiêu đề<input id="sh" required minlength="4" maxlength="150" placeholder="Tóm tắt nội dung của bạn"></label>
    <label>${k==='bug'?'Các bước tái hiện lỗi':'Nội dung chi tiết'}<textarea id="sc" required minlength="10" maxlength="5000" rows="7" placeholder="Mô tả chi tiết… Dán link ảnh / video làm bằng chứng nếu có."></textarea></label>
    <div class="form-actions"><button class="button green" type="submit">Gửi ${NAMES[k].toLowerCase()}</button></div><p role="status" class="status" id="form-status"></p></form>
    <aside class="side-card" style="align-self:start"><h3>${SUP[k][1]}</h3><p class="muted">${SUP[k][2]}</p><h3 style="margin-top:18px">Phiếu của bạn (${money(d.total)})</h3><div class="tickets">${d.rows.length?d.rows.map(r=>`<a href="#/bai/${Number(r.id)}"><b>${esc(r.title)}</b><small>${esc(r.created_at)} · <span class="st s${r.status}">${STATUS[r.status]}</span>${r.replies?' · '+money(r.replies)+' phản hồi':''}</small></a>`).join(''):'<p class="muted" style="font-size:12px">Chưa có phiếu nào.</p>'}</div></aside></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;

      ${napMethod==='card'&&t.card?`<div class="form-grid" style="margin-top:16px"><label>Nhà mạng<select id="ct">${t.telcos.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Số seri<input id="cs" inputmode="numeric" maxlength="20" autocomplete="off"></label></div><label>Mã thẻ<input id="cc" inputmode="numeric" maxlength="20" autocomplete="off"></label><p class="price-note" style="text-align:left">Chọn đúng mệnh giá thẻ ở bước 02, sai mệnh giá có thể mất thẻ.${t.cardRate<100?' Thẻ cào nhận '+t.cardRate+'% mệnh giá.':''}</p>`:''}</section>
    <section class="store-section"><div class="step-title"><span>02</span><div><h2>Chọn gói ngọc</h2><p>${t.x3?'Đang khuyến mãi X3, số ngọc đã tính sẵn.':'Khi có khuyến mãi nạp X3, số ngọc tự tăng theo.'}</p></div></div>
      <div class="gems luxury-gems">${packs.map((p,i)=>`<button type="button" class="gem ${i===napPack?'selected':''}" data-pk="${i}" aria-pressed="${i===napPack}"><span class="selection-tick" aria-hidden="true">${ic('check',12)}</span><span class="gem-art" aria-hidden="true">${gem(34)}</span><strong>${money(p[t.x3?2:1])} <small>ngọc</small></strong><span class="gem-x3">${t.x3?'Thường: '+money(p[1]):'Khi X3: '+money(p[2])} ngọc</span><span class="gem-price">${money(p[0])} <small>đ</small></span></button>`).join('')}</div>
      <p class="price-note">Chuyển khoản số tiền khác được cộng theo các mệnh giá trên (30.000đ = 32 + 13 ngọc).</p></section>
    <section class="store-help"><span>${ic('info',18)}</span><p>Cần trợ giúp? <a href="#/bao-loi">Gửi yêu cầu hỗ trợ ${ic('external',12)}</a><br>Chuyển khoản đúng số tiền và đúng nội dung để được cộng tự động.</p></section></div>
  <aside class="order-column"><section class="order-card"><div class="order-top"><span class="eyebrow">LỰA CHỌN CỦA BẠN</span><h2>Chi tiết gói ngọc</h2><span class="order-mark">${gem(60)}</span></div><div class="order-content">
    <div class="order-gem"><span>${gem(22)}</span><div><b>${money(sel[t.x3?2:1])} ngọc</b><small>${t.x3?'Đang khuyến mãi X3':'Khi khuyến mãi X3: '+money(sel[2])+' ngọc'}</small></div></div>
    <dl><div><dt>Tài khoản</dt><dd>${me?esc(me.username):'Chưa đăng nhập'}</dd></div><div><dt>Cách nạp</dt><dd>${napMethod==='bank'?'Chuyển khoản QR':'Thẻ cào'}</dd></div></dl>
    <div class="order-total"><span>Tổng thanh toán</span><strong>${money(sel[0])} <small>đ</small></strong></div>
    <button class="button order-submit" type="button" id="paygo" ${t.bank||t.card?'':'disabled'}>${!me?'Đăng nhập để nạp':napMethod==='bank'?'Tạo mã QR chuyển khoản':'Nạp thẻ'} <span>${ic('arrow',16)}</span></button>
    <div id="qrbox"></div><p class="order-disclaimer">${napMethod==='bank'?'Chuyển đúng nội dung, ngọc được cộng sau vài giây.':'Thẻ được kiểm tra rồi cộng ngọc, thường trong vài phút.'}</p></div></section>
    <details class="store-faq"><summary>Bao lâu thì nhận được ngọc?</summary><p>Chuyển khoản đúng số tiền và nội dung: vài giây. Thẻ cào: sau khi thẻ được kiểm tra. Đang online sẽ thấy thông báo "Bạn đã nạp … ngọc vào tài khoản", đang offline thì nhận khi vào game.</p></details>
    <details class="store-faq"><summary>Chuyển sai nội dung thì sao?</summary><p>Tiền vẫn được ghi nhận nhưng không tự cộng. Hãy gửi Báo lỗi kèm ảnh giao dịch để ban quản trị kiểm tra.</p></details></aside></div>
  <section class="store-section" style="margin-top:22px"><div class="step-title"><span>03</span><div><h2>Lịch sử nạp</h2><p>Các yêu cầu nạp gần đây của bạn.</p></div></div><div id="hist">${me?'<div class="loading">Đang tải…</div>':'<p class="muted" style="font-size:12px">Đăng nhập để xem lịch sử nạp.</p>'}</div></section>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{napMethod=b.dataset.m;gems()});
  document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{napPack=+b.dataset.pk;gems()});
  $('#paygo').onclick=()=>{if(!me)return loginBox();napMethod==='bank'?payBank(sel[0]):payCard(sel[0])};
  if(me)drawHist()}
async function payBank(amount){
  const r=await act(()=>api('topup/bank',{amount}));if(!r)return;
  const qr=`https://img.vietqr.io/image/${encodeURIComponent(r.bank)}-${encodeURIComponent(r.account)}-compact2.png?amount=${r.amount}&addInfo=${encodeURIComponent(r.memo)}&accountName=${encodeURIComponent(r.owner||'')}`;
  $('#qrbox').innerHTML=`<div class="qr-box"><img src="${esc(qr)}" alt="Mã QR chuyển khoản ${money(r.amount)}đ"><dl><div><dt>Ngân hàng</dt><dd>${esc(r.bank)}</dd></div><div><dt>Số tài khoản</dt><dd>${esc(r.account)}<button type="button" class="copy" data-c="${esc(r.account)}">Chép</button></dd></div><div><dt>Chủ tài khoản</dt><dd>${esc(r.owner||'')}</dd></div><div><dt>Số tiền</dt><dd>${money(r.amount)}đ</dd></div><div><dt>Nội dung</dt><dd>${esc(r.memo)}<button type="button" class="copy" data-c="${esc(r.memo)}">Chép</button></dd></div></dl></div>`;
  $('#qrbox').querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.c).then(()=>toast('Đã chép')));drawHist()}
async function payCard(amount){
  const s=$('#cs').value.trim(),c=$('#cc').value.trim();if(!s||!c)return toast('Nhập số seri và mã thẻ',1);
  const b=$('#paygo');b.disabled=true;const r=await act(()=>api('topup/card',{telco:$('#ct').value,amount,serial:s,code:c}),'Đã gửi thẻ, đang chờ xử lý');b.disabled=false;
  if(r){await loadMe();gems()}}
async function drawHist(){const h=await api('topup/history').catch(()=>[]);$('#hist').innerHTML=h.length?`<table class="hist"><thead><tr><th>Lúc</th><th>Cách</th><th>Số tiền</th><th>Trạng thái</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${x.method==='bank'?'Chuyển khoản':esc(x.telco)}</td><td>${money(x.amount)}đ</td><td><span class="st s${[0,2,3][x.status]}">${TOP_STATUS[x.status]}</span>${x.note?`<small>${esc(x.note)}</small>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="muted" style="font-size:12px">Chưa có giao dịch.</p>'}

function avatarSrc(g){return '/assets/'+(['traidat.gif','namek.gif','xayda.gif'][Number(g)]||'traidat.gif')}
function memberPortrait(author,reply=false){
 const size=reply?' reply-avatar':'';
 if(/^black\s*goku$/i.test(String(author).trim()))return '<img class="rose-portrait'+size+'" src="/assets/black-goku-rose.webp" alt="">';
 return '<span class="player-portrait'+size+'" aria-hidden="true"></span>';
}
let streamRequest=0;
async function stream(kind,filter='all',page=1){
  const serial=++streamRequest, hash=location.hash;
  const privateBox=kind!=='forum';
  const filters=privateBox?[['all','Phiếu của tôi']]:[['all','Tất cả bài đăng'],['mine','Bài của tôi'],['admin','Bài của Admin'],['latest','Mới nhất']];
  $('#app').innerHTML=`<div class="dragon-feed ${kind==='forum'?'classic-board':''}"><div class="dragon-cover">${me?`<span class="signed-medal" role="img" aria-label="Avatar nhân vật đã đăng nhập"></span><strong>${esc(me.characters?.[0]?.name||me.username)}</strong><button class="cover-exit" onclick="logout()">Đăng xuất</button>`:`<button class="cover-login" onclick="loginBox()" aria-label="Đăng nhập"><span class="entry-medal" aria-hidden="true"></span><i class="ki-star" aria-hidden="true"></i><i class="ki-star" aria-hidden="true"></i><i class="ki-star" aria-hidden="true"></i><i class="ki-star" aria-hidden="true"></i></button>`}</div>${communityTabs(kind)}<section class="dragon-compose" ${me?'':'hidden'}><button class="write">${ic('write',17)} <span>${kind==='forum'?'Bạn đang nghĩ gì? Chia sẻ với mọi người…':'Gửi '+NAMES[kind].toLowerCase()+' đến ban quản trị…'}</span>${ic('plus',15)}</button><div><button class="media">${ic('photo',15)} Ảnh/Video</button><button class="mood">${ic('mood',15)} Cảm xúc</button></div></section><nav class="dragon-filters">${filters.map(([id,label])=>`<button data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</nav><div id="dragon-list" aria-live="polite">Đang tải…</div></div>`;
  const compose=(focus)=>me?streamEditor(kind,focus):loginBox(()=>streamEditor(kind,focus));
  $('.write').onclick=()=>compose('title');$('.media').onclick=()=>compose('media');$('.mood').onclick=()=>compose('mood');
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>stream(kind,b.dataset.filter));
  const list=$('#dragon-list');
  if(!me&&(privateBox||filter==='mine')){list.innerHTML='<div class="dragon-card"><p>Đăng nhập để xem bài của bạn.</p><button class="button" onclick="loginBox()">Đăng nhập</button></div>';return}
  const d=await api(`posts?kind=${kind}&page=${page}&f=${filter}`);
  if(serial!==streamRequest||hash!==location.hash)return;
  list.innerHTML=d.rows.map(p=>`<article class="dragon-card ${+p.pinned&&+p.is_admin?'pinned-row':'player-row'}">${+p.pinned?'<span class="dragon-pin"><svg class="feed-glyph" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 9 0-2 5 3 5H6l3-5z M12 13v8"/></svg> GHIM BỞI ADMIN</span>':''}<div class="dragon-author">${memberPortrait(p.author)}<div><b>${esc(p.author)}</b><small>${+p.is_admin?'Ban quản trị':'Chiến binh'} · ${esc(p.created_at)}</small></div></div><a href="#/bai/${Number(p.id)}"><h3>${esc(p.title)}</h3>${+p.is_admin&&poster(p.title)?'':`<p class="board-excerpt">${esc(p.excerpt||'')}</p>`}${postPhoto(p)}${+p.is_admin&&poster(p.title)?`<img class="event-poster" src="${poster(p.title)}" alt="${esc(p.title)}">`:''}</a>${privateBox?`<small>${esc(STATUS[p.status])}</small>`:''}<footer>${kind==='forum'?`<button data-like="${Number(p.id)}" aria-pressed="${!!Number(p.liked)}"><svg class="feed-glyph" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h4v11H3z M7 11l5-7c1-1 3 0 2.5 2L14 9h5a2 2 0 0 1 2 2.4l-1.5 7a2 2 0 0 1-2 1.6H9l-2-1"/></svg> Thích</button>`:''}<a href="#/bai/${Number(p.id)}"><svg class="feed-glyph" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a9 9 0 0 1-13 8.1L3 21l1.5-4.9A9 9 0 1 1 21 11.5Z"/></svg> ${privateBox?'Phản hồi':'Bình luận'}</a><small class="feed-totals">${privateBox?'':`<span data-like-total>${Number(p.likes)||0}</span> lượt thích • `}${Number(p.replies)||0} ${privateBox?'phản hồi':'bình luận'}</small></footer></article>`).join('')||'<div class="dragon-card">Chưa có bài trong mục này.</div>';
  list.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{if(!me)return loginBox();b.disabled=true;const r=await act(()=>api('post/like',{id:Number(b.dataset.like),liked:b.getAttribute('aria-pressed')==='true'?0:1}));b.disabled=false;if(r){b.setAttribute('aria-pressed',!!Number(r.liked));b.closest('footer').querySelector('[data-like-total]').textContent=r.likes}});
  if(d.pages>1){
    const nav=document.createElement('nav');
    nav.className='nro-pages';nav.setAttribute('aria-label','Phân trang bài viết');
    const first=Math.max(1,Math.min(page-1,d.pages-2));
    function addPage(n,arrow){
      const button=document.createElement('button');button.type='button';
      const label=arrow==='next'?'Trang sau':arrow==='prev'?'Trang trước':'Trang '+n;
      button.setAttribute('aria-label',label);
      if(arrow){button.className='page-arrow';button.innerHTML='<svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="'+(arrow==='next'?'m7 4 6 6-6 6':'m13 4-6 6 6 6')+'" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
      else button.textContent=n;
      if(n===page)button.setAttribute('aria-current','page');
      else button.onclick=async()=>{await stream(kind,filter,n);const heading=document.querySelector('.dragon-filters');if(heading){heading.scrollIntoView({block:'start'});heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}};
      nav.append(button)
    }
    if(page>1)addPage(page-1,'prev');
    for(let n=first;n<=Math.min(first+2,d.pages);n++)addPage(n);
    if(page<d.pages)addPage(page+1,'next');
    list.append(nav)
  }

}
function postPhoto(p){
 const src=p.photo;
 if(typeof src!=='string'||!/^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(src))return '';
 return `<img class="attached-photo" loading="lazy" src="${src}" alt="Ảnh đính kèm bài viết">`;
}
async function preparePhoto(file){
 if(file.size>12*1024*1024)throw Error('Chọn ảnh nhỏ hơn 12 MB.');
 const url=URL.createObjectURL(file),img=new Image();
 try{
  img.src=url;await img.decode();
  const canvas=document.createElement('canvas');
  let scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
  for(let i=0;i<5;i++){
   canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/jpeg',0.82);if(data.startsWith('data:image/jpeg;base64,')&&data.length<=320000)return data;
   scale*=0.75;
  }
  throw Error('Ảnh quá lớn sau khi nén. Hãy chọn ảnh khác.');
 }finally{URL.revokeObjectURL(url)}
}

function streamEditor(kind,focus){
 const forum=kind==='forum', name=me?.characters?.[0]?.name||me?.username||'Chiến binh';
 const heading=forum?'Viết bài mới':NAMES[kind];
 $('#dialog-body').innerHTML=`<div class="pub-head"><h2 id="publish-title">${heading}</h2><div class="pub-user">${memberPortrait(name)}<b>${esc(name)}</b><small>${forum?'Diễn đàn':'Phiếu hỗ trợ'}</small></div></div>
 <form id="stream-form" aria-labelledby="publish-title">${kind==='report'?'<label>Nhân vật bị tố cáo<input name="target" required maxlength="64"></label>':''}
 <label>Tiêu đề<input name="title" required minlength="4" maxlength="150" placeholder="Đặt tiêu đề cho ${forum?'bài viết':'phiếu của bạn'}"></label>
 <label><span class="pub-caption">Nội dung <output id="pub-count">0 / 4600</output></span><textarea name="content" required minlength="10" maxlength="4600" placeholder="${forum?'Bạn muốn chia sẻ điều gì với anh em?':'Mô tả chi tiết để ban quản trị xem xét…'}"></textarea></label>
 <div class="photo-preview" hidden><img alt="Ảnh đã chọn"><button type="button" aria-label="Xóa ảnh">×</button></div><input id="pub-file" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="pub-tools"><button type="button" id="pick-photo">${ic('photo',16)} Ảnh từ máy</button><button type="button" data-tool="media" aria-controls="pub-media" aria-expanded="false">${ic('link',14)} Liên kết</button><button type="button" data-tool="mood" aria-controls="pub-mood" aria-expanded="false">${ic('mood',14)} Cảm xúc</button></div>
 <label hidden id="pub-media">Liên kết ảnh hoặc video<input name="media" type="url" pattern="https://.+" maxlength="350" placeholder="https://…"></label>
 <label hidden id="pub-mood">Cảm xúc<select name="mood"><option value="">Chọn cảm xúc</option><option>😊 Vui vẻ</option><option>🔥 Hào hứng</option><option>🤔 Thắc mắc</option></select></label>
 <div class="pub-actions"><button type="button" class="pub-cancel">Hủy</button><button type="submit" class="pub-send">${forum?'Đăng bài':'Gửi '+heading.toLowerCase()} ${ic('arrow',16)}</button></div></form>`;
 const dialog=$('#dialog'),form=$('#stream-form'),fields=form.elements;
 let photo='',busy=false;
 const picker=form.querySelector('#pub-file'),preview=form.querySelector('.photo-preview'),sendButton=form.querySelector('.pub-send');
 form.querySelector('#pick-photo').onclick=()=>picker.click();
 picker.onchange=async()=>{const file=picker.files[0];if(!file)return;busy=true;sendButton.disabled=true;picker.disabled=true;
 try{photo=await preparePhoto(file);preview.querySelector('img').src=photo;preview.hidden=false}
 catch(err){toast(err.name==='EncodingError'?'Không đọc được ảnh. Hãy chọn JPG, PNG hoặc WebP.':err.message,1)}
 finally{picker.value='';picker.disabled=false;busy=false;sendButton.disabled=false}};
 preview.querySelector('button').onclick=()=>{photo='';preview.hidden=true;preview.querySelector('img').removeAttribute('src')};
 if(!dialog.open)dialog.showModal();
 function toggle(key,open){$('#pub-'+key).hidden=!open;form.querySelector('[data-tool="'+key+'"]').setAttribute('aria-expanded',String(open));if(open)fields[key].focus()}
 form.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>toggle(btn.dataset.tool,btn.getAttribute('aria-expanded')!=='true'));
 if(focus==='media'||focus==='mood')toggle(focus,true);else fields.title.focus();
 fields.content.oninput=()=>$('#pub-count').value=fields.content.value.length+' / 4600';
 fields.media.oninvalid=()=>toggle('media',true);
 form.querySelector('.pub-cancel').onclick=()=>dialog.close();
 form.onsubmit=async e=>{e.preventDefault();const send=form.querySelector('.pub-send');if(send.disabled||busy)return;send.disabled=true;
 try{const d=Object.fromEntries(new FormData(form));const r=await act(()=>api('post/create',{kind,photo,title:d.title,target:d.target||'',content:[d.content.trim(),d.mood,d.media].filter(Boolean).join('\n\n')}),'Đã gửi');if(r){dialog.close();location.hash='#/bai/'+r.id}}finally{send.disabled=false}}
}

/* ---------- khởi động ---------- */
$('#dialog .close').onclick=()=>$('#dialog').close();
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});
(async()=>{try{const s=await getInfo();document.title=s.name+' · Ngọc Rồng Online';document.querySelectorAll('.sv-name').forEach(e=>e.textContent=s.name)}catch(e){}
  await loadMe();route()})();
