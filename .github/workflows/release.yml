name: Release

# Đẩy tag dạng v1.2.3 (hoặc bấm Run workflow) để tạo bản phát hành và Docker image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag phát hành (vd v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # 20.jar đã được ký bằng chữ ký số của tác giả; khóa ký không nằm trên GitHub nên không build lại jar.
      - name: Đóng gói
        run: |
          mkdir -p dist
          cp 20.jar dist/nro-server-${TAG}.jar
          zip -r -q dist/nro-sql-${TAG}.zip sql
          zip -q dist/nro-scripts-${TAG}.zip Config.properties maintenanceConfig.txt run.bat run_vps_yeu.bat run_vps_yeu.sh restart_server.bat HUONG_DAN_PANEL.md HUONG_DAN_VPS_YEU.md
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Tạo bản phát hành
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NRO Server ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tên image (chữ thường)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build và đẩy Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Máy chủ Ngọc Rồng Online (Java 21)
